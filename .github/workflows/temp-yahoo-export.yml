name: Temporary Yahoo Finance 2Y Export

on:
  push:
    branches:
      - temp-yahoo-links-20260819
    paths:
      - .github/workflows/temp-yahoo-export.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-yahoo-export.yml
      - temp_yahoo_export.py

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Download, normalize, and validate Yahoo Finance daily data
        run: python temp_yahoo_export.py

      - name: Upload validated CSV package
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-finance-2y-csvs
          path: yahoo_exports/
          if-no-files-found: error
          retention-days: 1
