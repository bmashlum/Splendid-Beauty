name: Temporary Yahoo Finance 2Y Export

on:
  push:
    branches:
      - temp-yahoo-links-20260819
    paths:
      - .github/workflows/temp-yahoo-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Download, normalize, and validate Yahoo Finance daily data
        run: python temp_yahoo_export.py

      - name: Upload validated CSV package
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-finance-2y-csvs
          path: yahoo_exports/
          if-no-files-found: error
          retention-days: 1

      - name: Commit validated exports to temporary branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yahoo_exports
          git commit -m "Add temporary Yahoo Finance 2Y exports [skip ci]"
          git push
